name: 功能请求
description: 建议一个新功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你想要的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 你遇到了什么问题？这个功能能解决什么？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 解决方案
      description: 描述你希望的解决方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有其他替代方案？
