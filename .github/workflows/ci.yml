name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Format check
      run: |
        if [ -n "$(gofmt -l main.go)" ]; then
          echo "代码未格式化，运行: gofmt -w main.go"
          gofmt -l main.go
          exit 1
        fi

    - name: Syntax check
      run: CGO_ENABLED=0 go build -o /dev/null . || true
